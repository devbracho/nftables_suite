# Review and adjust sources and log_prefix values before applying.

# Define a group with shared rules
[group:open]
members=root,user1,_apt
egress_policy=allow_all

# Users that may browse only specific sites (e.g. google)
# [group:limited]
# members=user1
# egress_policy=block_all
# egress_allow_domains=www.google.com
# egress_allow_tcp_ports=80,443,5025

# Users that must not browse the internet at all
# Note: 151.101.0.0/16 = Fastly CDN covers PyPI, Python.org
# Note: 185.199.108.0/22 = GitHub Pages CDN covers pyenv.run
[group:restricted]
members=user2,user3
egress_policy=block_all
egress_allow_domains=192.168.1.0/24,151.101.0.0/16,185.199.108.0/22,bitbucket.org,artefact.skao.int,google.com
egress_allow_tcp_ports=22,80,443,8080

# Users with full AI tools access (ChatGPT, Claude, GitHub Copilot)
[group:ai_tools_full]
members=user4
egress_policy=block_all
egress_allow_domains=192.168.1.0/24,140.82.112.0/20,185.199.108.0/22,151.101.0.0/16,13.107.0.0/16,20.0.0.0/8,40.0.0.0/8,52.0.0.0/8,104.0.0.0/8,23.0.0.0/8,95.100.0.0/16,150.171.0.0/16,173.222.0.0/15,chat.openai.com,openai.com,chatgpt.com,challenges.cloudflare.com,cdn.oaistatic.com,api.openai.com,auth0.openai.com,claude.ai,anthropic.com,api.anthropic.com,copilot-proxy.githubusercontent.com,*.githubcopilot.com,default.exp-tas.com,vscode.dev,*.vscode-cdn.net,api.github.com,github.com,*.github.io,objects.githubusercontent.com,*.azurefd.net,*.azure.com,*.openai.azure.com,api.githubcopilot.com,githubcopilot.com,*.microsoft.com,*.live.com,*.visualstudio.com,vscode-auth.github.com,bitbucket.org,artefact.skao.int,google.com
egress_allow_tcp_ports=80,443,8080

# Users with basic AI tools access (Copilot authentication only)
# Note: More restrictive than ai_tools_full - fewer domains allowed
[group:ai_tools_basic]
members=user5
egress_policy=block_all
egress_allow_domains=192.168.1.0/24,chat.openai.com,openai.com,chatgpt.com,challenges.cloudflare.com,cdn.oaistatic.com,api.openai.com,auth0.openai.com,claude.ai,anthropic.com,api.anthropic.com,140.82.112.0/20,copilot-proxy.githubusercontent.com,*.githubcopilot.com,default.exp-tas.com,vscode.dev,*.vscode-cdn.net,api.github.com,github.com,*.github.io,objects.githubusercontent.com,*.azurefd.net,*.azure.com,*.openai.azure.com,api.githubcopilot.com,githubcopilot.com
egress_allow_tcp_ports=80,443,8080

# service: node_exporter (Prometheus metrics collector)
[node_exporter]
tcp_ports=9100
sources=192.168.1.0/24
log_prefix=NFT-CONN node_exporter discover

# service: alertmanager (processes: alertmanager)
[alertmanager]
tcp_ports=9094
udp_ports=9094
sources=0.0.0.0/0
log_prefix=NFT-CONN alertmanager discover

# service: anydesk (processes: anydesk)
[anydesk]
tcp_ports=7070
udp_ports=50001
sources=0.0.0.0/0
log_prefix=NFT-CONN anydesk discover

# service: avahi-daemon (processes: avahi-daemon)
[avahi_daemon]
udp_ports=40440
sources=0.0.0.0/0
log_prefix=NFT-CONN avahi-daemon discover

# service: mdns (processes: avahi-daemon)
[mdns]
udp_ports=5353
sources=0.0.0.0/0
log_prefix=NFT-CONN mdns discover

# service: nginx (processes: nginx)
[nginx]
tcp_ports=80,443
sources=0.0.0.0/0
log_prefix=NFT-CONN nginx discover

# service: ssh (processes: sshd)
[ssh]
tcp_ports=22
sources=0.0.0.0/0
log_prefix=NFT-CONN ssh discover

# service: sunrpc (processes: rpcbind)
[sunrpc]
tcp_ports=111
udp_ports=111
sources=0.0.0.0/0
log_prefix=NFT-CONN sunrpc discover

# service: udp_48743
[udp_48743]
udp_ports=48743
sources=0.0.0.0/0
log_prefix=NFT-CONN udp_48743 discover

# service: Xtigervnc (processes: Xtigervnc)
[xtigervnc]
tcp_ports=5901-5920
sources=0.0.0.0/0
log_prefix=NFT-CONN Xtigervnc discover

# SSH ports for questasim license
[SSH_tunnel]
tcp_ports=2100,34643,36175,1717
sources=0.0.0.0/0
log_prefix=SSH_tunnel_questasim

# rustdesk-server
[rustdesk_server]
tcp_ports=21114-21119
udp_ports=21116
sources=0.0.0.0/0
log_prefix=Rustdesk-server

# service: isimgui (processes: isimgui)
[isimgui]
tcp_ports=54575
sources=0.0.0.0/0
users=user3
log_prefix=NFT-CONN isimgui discover

# service: udp_60451
[udp_60451]
udp_ports=60451
sources=0.0.0.0/0
log_prefix=NFT-CONN udp_60451 discover

# Docker bridge network (for gitlab-runner containers)
# Containers access internet via NAT, appears as root user from host
# This allows containers to reach PyPI, GitHub, etc.
[docker_bridge]
interfaces=docker0,br-*
sources=172.16.0.0/12
log_prefix=NFT-CONN docker-bridge forward
